name: Answer quality

# Generating and judging answers with a local model takes a while, so this
# runs weekly and on demand rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OLLAMA_MODEL: qwen3:1.7b
      OLLAMA_JUDGE_MODEL: qwen3:1.7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull "$OLLAMA_MODEL"
      - name: Build benchmark indexes
        run: python -m repomentor eval prepare
      - name: Check answers against thresholds
        run: python -m repomentor eval check --answers
      - name: Keep the judged answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-check
          path: evaluation/results/answers-check.json
