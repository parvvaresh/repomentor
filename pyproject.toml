[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repomentor"
version = "0.3.0"
description = "Citation-grounded answers about GitLab and GitHub codebases, with local models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.setuptools.packages.find]
include = ["repomentor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
